<script>
'use strict';
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

const modules=[{id:'chatgpt',name:'ChatGPT',letter:'C',desc:'Code block actions',version:'1.1.0',source:'Personal',hooks:[['copy','Copy diagnostics'],['termux','Run in Termux']],apps:['chatgpt'],profile:true,update:'1.2.0'},{id:'wordmaster',name:'Word Master',letter:'W',desc:'Night filter',version:'1.1.0',source:'Personal',hooks:[['night','Night filter']],apps:['wordmaster'],profile:true,update:null},{id:'obtainx',name:'ObtainX integration',letter:'O',desc:'Manual download handoff',version:'Built-in',source:'Built-in',hooks:[['neo','Neo Store integration'],['droid','Droid-ify integration']],apps:['neo','droid'],update:null},{id:'mcc',name:'MCC Control',letter:'M',desc:'Manual diamond control',version:'Built-in',source:'Built-in',hooks:[['diamond','Manual diamond control']],apps:['mcc'],update:null}];
const apps=[{id:'chatgpt',name:'ChatGPT',module:'chatgpt',scope:true,compat:true},{id:'wordmaster',name:'Word Master',module:'wordmaster',scope:true,compat:true},{id:'neo',name:'Neo Store',module:'obtainx',scope:true,compat:true},{id:'droid',name:'Droid-ify',module:'obtainx',scope:false,compat:true},{id:'mcc',name:'MCC',module:'mcc',scope:true,compat:false}];
const initial={flags:{copy:true,termux:true,night:true,neo:true,droid:false,diamond:false},scope:Object.fromEntries(apps.map(a=>[a.id,a.scope])),source:{},profiles:{chatgpt:{active:'Default',override:'',values:{Default:{show:true,diagnostics:false,interval:1200},Quiet:{show:false,diagnostics:false,interval:1200}}},wordmaster:{active:'Default',override:'',values:{Default:{custom:true,opacity:84,tone:'navy'}}}},pending:{},updated:{},events:[{module:'chatgpt',title:'Registration observed',detail:'Illustrative runtime event · not live evidence'},{module:'wordmaster',title:'Effect unconfirmed',detail:'Illustrative warning · enabled preference is not execution proof'}],theme:'dark'};
const clone=x=>JSON.parse(JSON.stringify(x));let state=clone(initial),drafts={},editing={},history=[],route={page:'modules',tab:'Tweaks'},query='',filter='Installed',toastTimer;
const mFor=id=>modules.find(m=>m.id===id),aFor=id=>apps.find(a=>a.id===id),doc=id=>drafts[id]||(drafts[id]=clone(state.profiles[id])),editName=id=>editing[id]||doc(id).active,dirty=id=>!!drafts[id]&&JSON.stringify(drafts[id])!==JSON.stringify(state.profiles[id]);

const ib=(label,action,icon)=>`<button class="iconbtn" aria-label="${E(label)}" title="${E(label)}" data-action="${E(action)}">${ic(icon)}</button>`;
const status=(label,type='neutral')=>`<span class="state ${type}">${E(label)}</span>`;
const row=(title,subtitle,action,leading='',trailing='')=>`<button class="row row-btn" data-action="${E(action)}">${leading}<div class="grow"><h3>${E(title)}</h3>${subtitle?`<p class="muted">${E(subtitle)}</p>`:''}</div>${trailing||`<span class="chev">${ic('chev')}</span>`}</button>`;
const section=(title,body,extra='')=>`<section class="section"><div class="section-title"><h2>${E(title)}</h2>${extra}</div><div class="surface">${body}</div></section>`;
const notice=(title,desc)=>`<div class="notice">${ic('info')}<div><strong>${E(title)}</strong><div>${E(desc)}</div></div></div>`;
const switchRow=(title,desc,checked,change,disabled=false)=>`<label class="row"><div class="grow"><h3>${E(title)}</h3><p class="muted">${E(desc)}</p></div><input type="checkbox" role="switch" class="switch" aria-label="${E(title)}" data-change="${E(change)}" ${checked?'checked':''} ${disabled?'disabled':''}></label>`;

function back(){let r=history.pop();if(r)navigate(r,true);else navigate({page:'modules'},true)}
function nav(page){history=[];navigate({page},true)}
function currentNav(){return ['module','hook','repository'].includes(route.page)?'modules':route.page==='app'?'apps':route.page==='diagnostics'?'home':route.page}
function chrome(){let n=navItems.map(([p,t,i])=>`<button class="navbtn ${currentNav()===p?'active':''}" data-action="nav:${p}" ${currentNav()===p?'aria-current="page"':''}>${ic(i)}<span>${t}</span></button>`).join('');$('#rail').innerHTML=`<div class="brand"><span class="logo">${ic('terminal')}</span>HookLab</div>${n}<div class="foot">INTERACTIVE CONCEPT<br>Simulated data · no device access</div>`;$('#bottom').innerHTML=n;let detail=['module','hook','app','repository','diagnostics'].includes(route.page);let title=route.page==='module'?mFor(route.id).name:route.page==='hook'?'Hook details':route.page==='app'?aFor(route.id).name:route.page==='repository'?'Repository':route.page==='diagnostics'?'Diagnostics':'HookLab';$('#top').innerHTML=`<div class="top-left">${detail?ib('Back','back','arrow'):''}<span class="top-title">${E(title)}</span></div><div class="top-right"><span class="mock">MOCK · OFFLINE</span>${ib('Toggle theme','theme',state.theme==='dark'?'sun':'moon')}${detail?ib('More actions','more','more'):''}</div>`;document.documentElement.dataset.theme=state.theme}
function mStatus(m){if(m.apps.some(id=>!aFor(id).compat))return ['Incompatible','danger'];if(m.apps.some(id=>!state.scope[id]))return ['Scope required','warn'];if(m.id==='wordmaster'&&state.flags.night)return ['Effect unconfirmed','warn'];let count=m.hooks.filter(([id])=>state.flags[id]).length;return count?[`${count}/${m.hooks.length} enabled`,'good']:['Disabled','neutral']}

function appsPage(){return `<div class="pagehead"><div><div class="eyebrow">Target applications</div><h1>Apps</h1><p class="muted">Manage scope and per-app profiles.</p></div></div><label class="search">${ic('search')}<input id="search" aria-label="Search apps" placeholder="Search apps" value="${E(query)}"></label><section class="section surface" id="results">${appList()}</section>`}
function tabs(m){return `<div class="tabs" role="tablist" aria-label="Module sections">${['Tweaks','Apps','Activity','About'].map(t=>`<button role="tab" aria-selected="${(route.tab||'Tweaks')===t}" class="tab ${(route.tab||'Tweaks')===t?'active':''}" data-action="tab:${t}">${t}</button>`).join('')}</div>`}
function hookRows(m){return m.hooks.map(([id,name])=>`<div class="row"><button class="grow row-btn" style="padding:0;min-height:48px" data-action="hook:${m.id}:${id}"><h3>${E(name)}</h3><p class="muted">${state.flags[id]?'Enabled preference':'Disabled preference'} · Details ${ic('chev')}</p></button><input type="checkbox" class="switch" role="switch" aria-label="Enable ${E(name)}" data-change="flag:${m.id}:${id}" ${state.flags[id]?'checked':''}></div>`).join('')}
function profileBar(m){let d=doc(m.id);return `<div class="profilebar"><div class="grow"><h3>Editing profile</h3><small>Active: ${E(d.active)}${d.override?' · App override: '+E(d.override):''}</small></div><select aria-label="Editing profile" data-change="edit:${m.id}">${Object.keys(d.values).map(n=>`<option ${n===editName(m.id)?'selected':''}>${E(n)}</option>`).join('')}</select></div><div class="actions" style="margin-top:8px">${btn('Manage profiles',`profiles:${m.id}`,'textbtn')}</div>`}
function typed(m){let d=doc(m.id),v=d.values[editName(m.id)];let range=(key,label,val,min,max,step,suffix)=>`<div class="rangebox"><div class="inline"><h3>${label}</h3><output id="out-${key}" class="muted">${val}${suffix}</output></div><input class="range" type="range" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${label}" data-range="${m.id}:${key}:${suffix}"></div>`;if(m.id==='chatgpt'){return section('Code block actions',switchRow('Show Run in Termux','Display the action below supported code blocks.',v.show,`value:${m.id}:show`)+(v.show?range('interval','Repeat-tap protection',v.interval,300,3000,100,' ms'):'')+`<div class="preview"><div class="inline"><span class="muted">Preview · simulated</span>${ic('copy')}</div><div class="code">echo "Hello"</div>${v.show?`<div class="divider"></div><span style="color:var(--accent)">${ic('terminal')} Run in Termux</span>`:''}</div>`)+(v.show?section('Advanced',switchRow('Layout diagnostics','Collect additional layout events.',v.diagnostics,`value:${m.id}:diagnostics`)):'')}
return section('Night filter',switchRow('Custom filter','Use your configured color and opacity.',v.custom,`value:${m.id}:custom`)+(v.custom?range('opacity','Opacity',v.opacity,40,128,1,'')+`<div class="row"><div class="grow"><h3>Tone</h3><small>Filter color</small></div><select data-change="value:${m.id}:tone" aria-label="Filter tone" style="background:var(--raised);border:1px solid var(--line);padding:12px;border-radius:10px">${['navy','neutral','warm'].map(t=>`<option ${t===v.tone?'selected':''}>${t}</option>`).join('')}</select></div>`:'')+`<div class="preview"><small>Illustrative filter preview</small><div id="filterPreview" style="background:#cbd3df;color:#1b2331;padding:20px;margin-top:8px;border-radius:9px;position:relative;overflow:hidden"><strong>Word Master</strong><div style="letter-spacing:6px;margin-top:10px">W O R D S</div><div id="filterOverlay" style="position:absolute;inset:0;pointer-events:none;background:${({navy:'#101a4a',neutral:'#252525',warm:'#7b3718'})[v.tone]};opacity:${v.custom?v.opacity/255:0}"></div></div></div>`) }
function dirtyBar(m){return `<div class="dirtybar" ${dirty(m.id)?'':'hidden'} id="dirty"><div><h3>Unsaved changes</h3><small>Review before saving</small></div><div class="actions">${btn('Discard',`discard:${m.id}`,'textbtn')}${btn('Review changes',`review:${m.id}`,'primary')}</div></div>`}
function modulePage(){let m=mFor(route.id),t=route.tab||'Tweaks',[s,k]=mStatus(m);let left='',aside='';if(t==='Tweaks'){left=section('Hooks',hookRows(m));if(m.profile)left+=`<div class="section">${profileBar(m)}</div>${typed(m)}${dirtyBar(m)}`;else left+=notice('No additional configuration','This module exposes independent hook controls.');aside=notice('How changes work','Hook preferences, archive publication and target process restarts are separate operations.');if(state.pending[m.id])aside+=notice('Restart required','A simulated change was saved. No target process was restarted.');if(m.id==='wordmaster')aside+=notice('Effect not confirmed','Enabled does not imply the filter is visible.');}
if(t==='Apps')left=section('Target applications',m.apps.map(id=>{let a=aFor(id);return row(a.name,`${state.scope[id]?'Scope granted':'Scope required'} · ${m.profile?(doc(m.id).override||'Inherits '+doc(m.id).active):'No profile'}`,`app:${id}`,avatar(m))}).join(''));
if(t==='Activity')left=section('Runtime evidence',state.events.filter(e=>e.module===m.id).map(e=>`<div class="row">${ic('activity')}<div><h3>${E(e.title)}</h3><p class="muted">${E(e.detail)}</p></div></div>`).join('')||'<div class="empty">No evidence available.</div>')+btn('All diagnostics','diagnostics','secondary');
if(t==='About')left=section('Module information',`<div class="row"><div class="grow"><h3>Selected version</h3><small>${E(state.updated[m.id]||m.version)} · ${E(m.source)}</small></div></div>${row('Version history','Installed and previous versions',`versions:${m.id}`)}${row('Publisher and signature','Review archive identity',`publisher:${m.id}`)}<details class="details"><summary>Technical information</summary><dl><dt>Module ID</dt><dd>${m.id}</dd><dt>Hook IDs</dt><dd>${m.hooks.map(x=>E(x[0])).join(', ')}</dd><dt>Evidence</dt><dd>Simulated; no archive signature verified</dd></dl></details>`);return `<div class="modulehero">${avatar(m,true)}<div class="grow"><h1>${E(m.name)}</h1><p class="muted">${E(state.updated[m.id]||m.version)} · ${E(m.source)}</p><div class="statusline">${status(s,k)}</div></div></div>${tabs(m)}<div class="workspace"><div>${left}</div>${aside?`<aside>${aside}</aside>`:''}</div>`}
function appPage(){let a=aFor(route.id),m=mFor(a.module);return `<div class="modulehero">${avatar(m,true)}<div><h1>${E(a.name)}</h1><p class="muted">${E(m.name)} · target application</p><div class="statusline">${status(a.compat?'Compatible':'Incompatible',a.compat?'good':'danger')}</div></div></div>${section('LSPosed scope',switchRow('Allow module scope','Simulates an explicit framework authorization.',state.scope[a.id],`scope:${a.id}`))}${m.profile?section('Configuration profile',row('Application override',doc(m.id).override||`Inherits ${doc(m.id).active}`,`override:${m.id}`,ic('settings'))+`<div class="row"><small>Overrides are staged with the module configuration and require review.</small></div>`):''}${section('Module',row(m.name,'Open shared module workspace',`module:${m.id}`,avatar(m)))}${m.profile&&dirty(m.id)?dirtyBar(m):''}`}
function hookPage(){let m=mFor(route.id),h=m.hooks.find(x=>x[0]===route.hook);return `<div class="pagehead"><div><div class="eyebrow">${E(m.name)}</div><h1>${E(h[1])}</h1><p class="muted">Independent hook preference</p></div></div>${section('Activation',switchRow('Enable hook','This does not prove runtime execution.',state.flags[h[0]],`flag:${m.id}:${h[0]}`))}${m.id==='wordmaster'?notice('Effect not confirmed','Physical runtime effect has not been established in this mock.'):''}${section('Manage',row('Module tweaks','Configure shared profile and options',`module:${m.id}`,ic('settings'))+row('Runtime evidence','View module-specific activity',`activity:${m.id}`,ic('activity'))+row('Safety and compatibility','Inspect simulated state',`safety:${m.id}:${h[0]}`,ic('shield')))}<details class="surface details"><summary>Technical details</summary><dl><dt>Mock hook ID</dt><dd>${E(h[0])}</dd><dt>Module</dt><dd>${E(m.id)}</dd><dt>Scope</dt><dd>Managed per app</dd></dl></details>`}
function repoPage(){return `<div class="pagehead"><div><div class="eyebrow">Distribution</div><h1>Repository</h1><p class="muted">Browse verified-package workflows in a simulated catalog.</p></div>${ib('Refresh catalog','refresh','refresh')}</div>${section('Source',row('Official repository','Mikeyphw / MikeysHookLab · offline demo','repoSource',ic('modules'))+row('Private access','Session-only access · disabled in prototype','repoAuth',ic('shield')))}<label class="search">${ic('search')}<input id="search" aria-label="Search repository" placeholder="Search repository" value="${E(query)}"></label><div class="filters">${['Installed','Updates'].map(f=>`<button class="chip ${filter===f?'active':''}" data-action="filter:${f}">${f==='Installed'?'All modules':f}</button>`).join('')}</div><div class="surface" id="results">${repoList()}</div>${notice('No network access','No credentials, signatures, releases or downloads are processed in this prototype.')}`}
function repoList(){return modules.filter(m=>[m.name,m.desc,m.id].join(' ').toLowerCase().includes(query.toLowerCase())&&(filter!=='Updates'||m.update&&!state.updated[m.id])).map(m=>`<div class="row">${avatar(m)}<div class="grow"><h3>${E(m.name)}</h3><p class="muted">${E(state.updated[m.id]||m.version)}${m.update&&!state.updated[m.id]?' → '+E(m.update):''}</p></div>${m.update&&!state.updated[m.id]?btn('Review',`update:${m.id}`,'secondary'):status('Current','neutral')}</div>`).join('')||'<div class="empty">No results.</div>'}
function homePage(){return `<div class="pagehead"><div><div class="eyebrow">Manager overview</div><h1>Home</h1><p class="muted">Your modules and configuration at a glance.</p></div></div>${notice('Simulated framework state','This prototype never reads or writes LSPosed preferences.')}<div class="split"><div class="surface metric"><small>Modules</small><strong>${modules.length}</strong></div><div class="surface metric"><small>Enabled preferences</small><strong>${Object.values(state.flags).filter(Boolean).length}</strong></div></div>${section('Needs attention',modules.filter(m=>['warn','danger'].includes(mStatus(m)[1])).map(m=>row(m.name,mStatus(m)[0],`module:${m.id}`,avatar(m))).join('')||'<div class="empty">Nothing requires attention.</div>')}${section('Quick access',row('Diagnostics','Runtime evidence and events','diagnostics',ic('activity'))+row('Repository','Available updates and releases','repository',ic('download')))} `}
function diagnosticsPage(){return `<div class="pagehead"><div><h1>Diagnostics</h1><p class="muted">Illustrative events, not live logs.</p></div></div>${section('Recent activity',state.events.map(e=>row(e.title,e.detail,`activity:${e.module}`,ic('activity'))).join('')||'<div class="empty">No events.</div>')}`}
function settingsPage(){return `<div class="pagehead"><div><h1>Settings</h1><p class="muted">Global manager preferences.</p></div></div>${section('Appearance',row('Theme',state.theme==='dark'?'Dark':'Light','theme',ic(state.theme==='dark'?'moon':'sun')))}${section('Administration',row('Repository settings','Sources and session access','repository',ic('download'))+row('Diagnostics','View example runtime activity','diagnostics',ic('activity'))+row('Reset prototype','Restore all simulated data','reset',ic('refresh')))}${notice('Prototype only','No device permissions, network requests or external storage.')}`}
function render(){chrome();$('#content').innerHTML=({home:homePage,modules:modulesPage,apps:appsPage,settings:settingsPage,module:modulePage,app:appPage,hook:hookPage,repository:repoPage,diagnostics:diagnosticsPage}[route.page]||modulesPage)();}
function patchDirty(id){let el=$('#dirty');if(el)el.hidden=!dirty(id)}
function modal(title,body,actions=''){let d=$('#dialog');if(d.open)d.close();d.innerHTML=`<h2>${E(title)}</h2>${body}<div class="actions">${btn('Close','close','textbtn')}${actions}</div>`;d.showModal()}
function close(){if($('#dialog').open)$('#dialog').close()}
function changes(id){let before=state.profiles[id],after=doc(id),diff=[];if(before.active!==after.active)diff.push(['Active profile',before.active,after.active]);if(before.override!==after.override)diff.push(['App override',before.override||'Inherit',after.override||'Inherit']);for(let name of new Set([...Object.keys(before.values),...Object.keys(after.values)])){let a=before.values[name],b=after.values[name];if(!a||!b){diff.push([`Profile: ${name}`,a?'Exists':'Not present',b?'Created':'Removed']);continue}for(let key of Object.keys(b))if(a[key]!==b[key])diff.push([`${name} · ${{show:'Show Run in Termux',diagnostics:'Layout diagnostics',interval:'Repeat-tap protection',custom:'Custom filter',opacity:'Opacity',tone:'Tone'}[key]||key}`,String(a[key]),String(b[key])])}return diff}
function showReview(id){let list=changes(id);modal('Review configuration',list.length?list.map(([label,a,b])=>`<div class="diff"><strong>${E(label)}</strong><span>${E(a)} → ${E(b)}</span></div>`).join('')+`<p class="muted">Saving changes updates simulated configuration only. Runtime confirmation is separate.</p>`:'<p>No changes to save.</p>',list.length?btn('Save changes',`save:${id}`,'primary'):'')}
function showProfiles(id){let d=doc(id);modal('Manage profiles',`<p class="muted">Select which profile is active. Editing a profile does not activate it.</p>${Object.keys(d.values).map(n=>`<div class="row"><div class="grow"><h3>${E(n)}</h3><small>${n===d.active?'Active':'Inactive'}</small></div>${n!==d.active?btn('Activate',`activate:${id}:${n}`,'textbtn'):''}${n!=='Default'?ib('Remove '+n,`removeProfile:${id}:${n}`,'close'):''}</div>`).join('')}<label for="newProfile" class="muted">New profile name</label><input id="newProfile" maxlength="24" placeholder="e.g. Minimal"><div id="profileError" class="error" role="alert"></div>`,btn('Create profile',`newProfile:${id}`,'primary'))}
function showOverride(id){let d=doc(id);modal('Application override',`<p class="muted">Choose a profile for this target app, or inherit the module’s active profile.</p><select id="override" aria-label="Override profile"><option value="">Inherit active profile</option>${Object.keys(d.values).map(n=>`<option ${n===d.override?'selected':''}>${E(n)}</option>`).join('')}</select>`,btn('Stage override',`stageOverride:${id}`,'primary'))}
function action(raw){let [cmd,id,arg]=raw.split(':');switch(cmd){case 'nav':nav(id);break;case 'back':back();break;case 'module':navigate({page:'module',id,tab:'Tweaks'});break;case 'hook':navigate({page:'hook',id,hook:arg});break;case 'app':navigate({page:'app',id});break;case 'activity':navigate({page:'module',id,tab:'Activity'});break;case 'repository':navigate({page:'repository'});break;case 'diagnostics':navigate({page:'diagnostics'});break;case 'tab':route.tab=id;render();window.scrollTo(0,0);break;case 'filter':filter=id;render();break;case 'theme':state.theme=state.theme==='dark'?'light':'dark';render();break;case 'close':close();break;case 'profiles':showProfiles(id);break;case 'activate':doc(id).active=arg;close();render();showProfiles(id);break;case 'newProfile':{let n=$('#newProfile').value.trim();if(!/^[\p{L}\p{N} _-]{1,24}$/u.test(n)||Object.hasOwn(doc(id).values,n)||Object.keys(doc(id).values).length>=8){$('#profileError').textContent='Use a unique name of 1–24 characters; maximum 8 profiles.';break}doc(id).values[n]=clone(doc(id).values[editName(id)]);editing[id]=n;close();render();tell('Profile staged. Review to save.');break}case 'removeProfile':modal('Remove profile?',`<p>Remove ${E(arg)} from the draft? Any active or override selection using it returns to Default or inheritance.</p>`,btn('Remove',`confirmRemove:${id}:${arg}`,'primary'));break;case 'confirmRemove':{let d=doc(id);if(arg==='Default')break;delete d.values[arg];if(d.active===arg)d.active='Default';if(d.override===arg)d.override='';if(editing[id]===arg)editing[id]='Default';close();render();break}case 'override':showOverride(id);break;case 'stageOverride':doc(id).override=$('#override').value;close();render();tell('Override staged. Review to save.');break;case 'review':showReview(id);break;case 'save':state.profiles[id]=clone(doc(id));delete drafts[id];state.pending[id]=true;close();render();tell('Configuration saved in prototype · restart not performed');break;case 'discard':modal('Discard changes?',`<p>Restore the last saved configuration for ${E(mFor(id).name)}.</p>`,btn('Discard',`confirmDiscard:${id}`,'primary'));break;case 'confirmDiscard':delete drafts[id];delete editing[id];close();render();tell('Draft discarded');break;case 'scopeReview':modal('Change scope?',`<p>${arg==='on'?'Grant':'Remove'} simulated LSPosed scope for ${E(aFor(id).name)}. Real authorization remains independent.</p>`,btn('Confirm',`scopeConfirm:${id}:${arg}`,'primary'));break;case 'scopeConfirm':state.scope[id]=arg==='on';close();render();tell('Simulated scope changed');break;case 'more':{let m=route.id&&mFor(route.id);modal('More actions',m?`${row('Manage profiles','Active profile and named profiles',`menuProfiles:${m.id}`)}${row('Version history','Installed and previous versions',`menuVersions:${m.id}`)}${row('Technical information','Publisher and signature',`menuPublisher:${m.id}`)}`:`${row('Repository settings','Browse sources','menuRepository')}`);break}case 'menuProfiles':close();if(mFor(id).profile)showProfiles(id);else tell('No typed profiles');break;case 'menuVersions':close();action(`versions:${id}`);break;case 'menuPublisher':close();action(`publisher:${id}`);break;case 'menuRepository':close();navigate({page:'repository'});break;case 'versions':modal('Version history',`<p>Current: ${E(state.updated[id]||mFor(id).version)}</p>${state.updated[id]?`<p>Previous: ${E(mFor(id).version)}</p>`:'<p class="muted">No previous archive in the mock.</p>'}`,state.updated[id]?btn('Review rollback',`rollback:${id}`,'secondary'):'');break;case 'rollback':modal('Review rollback',`<p>Return the mock selection to ${E(mFor(id).version)}? Publication and restart remain separate.</p>`,btn('Rollback',`confirmRollback:${id}`,'primary'));break;case 'confirmRollback':delete state.updated[id];state.pending[id]=true;close();render();tell('Mock rollback staged');break;case 'publisher':modal('Publisher and signature','<p>Illustrative archive information. No actual publisher key or signature is loaded or verified.</p>');break;case 'safety':modal('Safety and compatibility',`<p>Hook preference: ${state.flags[arg]?'Enabled':'Disabled'}</p><p>Safety lock: Unknown in prototype</p><p>Runtime: Not confirmed</p><p>Scope remains independently managed per target app.</p>`);break;case 'update':modal('Review update',`<p><strong>${E(mFor(id).name)}</strong></p><div class="diff">${E(mFor(id).version)} → ${E(mFor(id).update)}</div><p class="muted">Illustrative version only. A real install requires archive verification, compatible target versions and explicit publication.</p>`,btn('Simulate selection',`confirmUpdate:${id}`,'primary'));break;case 'confirmUpdate':state.updated[id]=mFor(id).update;state.pending[id]=true;close();render();tell('Mock update selected · not published');break;case 'repoSource':modal('Repository source','<p>Official repository: Mikeyphw/MikeysHookLab.</p><p>Personal repository selection is represented but no network access is available.</p>');break;case 'repoAuth':modal('Session access','<p>Do not enter real access tokens in this prototype. A production UI must preserve session-only credential handling.</p>');break;case 'refresh':tell('Offline demo catalog refreshed');break;case 'reset':modal('Reset prototype?','<p>All simulated edits, profiles, scope and update selections will be reset.</p>',btn('Reset','confirmReset','primary'));break;case 'confirmReset':state=clone(initial);drafts={};editing={};close();nav('modules');tell('Prototype reset');break;}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action)});
document.addEventListener('change',e=>{let el=e.target,c=el.dataset.change;if(!c)return;let [cmd,id,key]=c.split(':');if(cmd==='flag'){state.flags[key]=el.checked;state.pending[id]=true;render();tell('Hook preference changed · restart not performed')}else if(cmd==='scope'){let wanted=el.checked;el.checked=state.scope[id];action(`scopeReview:${id}:${wanted?'on':'off'}`)}else if(cmd==='edit'){editing[id]=el.value;render()}else if(cmd==='value'){doc(id).values[editName(id)][key]=el.type==='checkbox'?el.checked:el.value;render()}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='search'){query=el.value;$('#results').innerHTML=route.page==='apps'?appList():route.page==='repository'?repoList():moduleList()}if(el.dataset.range){let [id,key,suffix]=el.dataset.range.split(':');doc(id).values[editName(id)][key]=Number(el.value);let out=$('#out-'+key);if(out)out.value=el.value+suffix;if(key==='opacity'&&$('#filterOverlay'))$('#filterOverlay').style.opacity=Number(el.value)/255;patchDirty(id)}});
render();
</script></body></html>
