import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.tasks.*

plugins { id 'com.android.application' }
// Only the protected GitHub Actions environment injects stable signing inputs.
// PR/debug jobs never receive these variables, and libxposed hooks are unchanged.
def hooklabSigningEnv = [
    path: System.getenv('HOOKLAB_SIGNING_KEYSTORE_PATH'),
    storePass: System.getenv('HOOKLAB_SIGNING_STORE_PASSWORD'),
    keyAlias: System.getenv('HOOKLAB_SIGNING_KEY_ALIAS'),
    keyPass: System.getenv('HOOKLAB_SIGNING_KEY_PASSWORD')
]
def signingRequested = hooklabSigningEnv.values().any { it != null && !it.isEmpty() }
if (signingRequested && !hooklabSigningEnv.values().every { it != null && !it.isEmpty() }) {
    throw new GradleException('HOOKLAB_SIGNING_PARTIAL_CONFIG_REFUSED')
}

// Display-only provenance: use the actual checked-out commit, not GITHUB_SHA
// (which may be the synthetic pull-request merge ref). Unknown outside clean Git.
def hooklabBuildSource = 'unknown'
try {
    def sourceResult = providers.exec {
        workingDir rootProject.projectDir
        commandLine 'git', 'rev-parse', '--verify', 'HEAD'
        ignoreExitValue = true
    }
    def statusResult = providers.exec {
        workingDir rootProject.projectDir
        commandLine 'git', 'status', '--porcelain', '--untracked-files=all'
        ignoreExitValue = true
    }
    def source = sourceResult.standardOutput.asText.get().trim()
    if (sourceResult.result.get().exitValue == 0 && statusResult.result.get().exitValue == 0 &&
            (source ==~ /[0-9a-f]{40}/) && statusResult.standardOutput.asText.get().trim().isEmpty()) {
        hooklabBuildSource = source
    }
} catch (Exception ignored) {
    // Source exports and builds without Git are not source-attested.
}
android {
    namespace 'com.mikeyphw.hooklab'
    // Android SDK Platform 37 is published as android-37.0.
    // Explicit minor API level prevents AGP looking for android-37.
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }
    buildToolsVersion '36.0.0'
    buildFeatures {
        resValues = true
    }
    defaultConfig {
        applicationId 'com.mikeyphw.hooklab'
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName '0.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'hooklab_build_source', hooklabBuildSource
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (signingRequested) {
            hooklabStable {
                storeFile file(hooklabSigningEnv.path)
                storePassword hooklabSigningEnv.storePass
                keyAlias hooklabSigningEnv.keyAlias
                keyPassword hooklabSigningEnv.keyPass
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingRequested) signingConfig signingConfigs.hooklabStable
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation project(':runtime')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'
    implementation 'com.github.topjohnwu.libsu:service:6.0.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Only the hosted JVM test classpath includes API stubs; not bundled in the APK.
    testImplementation 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    // Hosted-only instrumentation: never packaged into the application APK.
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.6.1'
}

// Independent debug-only DEX fixture. SDK remains in the parent APK, never in the payload.
// Use the AGP generated-source API, not AndroidSourceSet.srcDir(Provider).
// The task's output DirectoryProperty supplies the dependency to every debug
// consumer (including lint), without wiring any release or other variant.
abstract class BuildMod01ProbeDex extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getPayloadJars()
    @Classpath abstract ConfigurableFileCollection getSdkJars()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getBuildTools()
    @InputFile @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getAndroidJar()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @javax.inject.Inject abstract org.gradle.process.ExecOperations getExecOperations()
    @javax.inject.Inject abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

    @TaskAction void generate() {
        File root = outputDirectory.get().asFile
        fileSystemOperations.delete { delete(root) }
        File out = new File(root, 'mod01-probe')
        if (!out.mkdirs() && !out.isDirectory()) {
            throw new GradleException('Cannot create MOD-01 generated asset directory')
        }
        execOperations.exec {
            commandLine buildTools.file('d8').get().asFile, '--release', '--min-api', '29',
                '--lib', androidJar.get().asFile, '--classpath', sdkJars.singleFile,
                '--output', out, payloadJars.singleFile
        }
        if (!exactProbeOutput(out)) {
            throw new GradleException('MOD-01 probe output inventory refused')
        }
    }

    // File.list() is a nullable Java String[], not a Groovy collection.
    // Statically check the JDK boundary when Gradle compiles the build script.
    @groovy.transform.CompileStatic
    static boolean exactProbeOutput(File out) {
        String[] entries = out.list()
        if (entries == null || entries.length != 1 || !'classes.dex'.equals(entries[0])) {
            return false
        }
        File dex = new File(out, 'classes.dex')
        long size = dex.length()
        return dex.isFile() && size > 0 && size <= 256L * 1024L
    }
}
// Separate, nontransitive artifact configurations: resolve the exact Java
// library JARs lazily and inherit their producer task dependencies. Neither is
// an APK implementation dependency. The SDK is a D8 classpath input only.
def probePayload = configurations.create('mod01ProbePayload') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
def probeSdk = configurations.create('mod01ProbeSdk') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
dependencies {
    mod01ProbePayload project(path: ':probe-payload', configuration: 'runtimeElements')
    mod01ProbeSdk project(path: ':sdk', configuration: 'runtimeElements')
}
def mod01SdkRoot = androidComponents.sdkComponents.sdkDirectory
androidComponents {
    onVariants(selector().withBuildType('debug')) { variant ->
        def dexTask = tasks.register('buildMod01ProbeDex', BuildMod01ProbeDex) {
            payloadJars.from(probePayload)
            sdkJars.from(probeSdk)
            buildTools.set(mod01SdkRoot.map { it.dir('build-tools/36.0.0') })
            androidJar.set(mod01SdkRoot.map { it.file('platforms/android-37.0/android.jar') })
        }
        variant.sources.assets.addGeneratedSourceDirectory(dexTask) { it.outputDirectory }
    }
}
