name: HookLab Design Contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    name: Frozen browser reference and semantic gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Local source gates (hosted, no Gradle)
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B scripts/qa/source_contract.py
          python3 -B scripts/qa/reference.py verify
          python3 -B scripts/qa/visual.py contract
          python3 -B -m unittest discover -s scripts/qa -p 'test_*.py' -v
          python3 -B scripts/qa/ci24.py inventory > "$RUNNER_TEMP/jvm-inventory.json"
      - name: Install deterministic browser and font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-roboto zsh
          fc-cache -f
          fc-match Roboto -f '%{family}\n' | grep -F Roboto
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium
      - name: Verify actual persistent Zsh session in isolated PTY
        run: python3 -B scripts/qa/termux_session_check.py --require-zsh
      - name: Repeat all 24 exact browser reference states
        run: |
          python3 -B scripts/qa/visual_image_checks.py
          python3 -B scripts/qa/reference.py repeat --out "$RUNNER_TEMP/hooklab-reference"
          python3 -B scripts/qa/visual_report_checks.py --reference "$RUNNER_TEMP/hooklab-reference/first"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/hooklab-reference/source-commit.txt"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hooklab-browser-reference-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-reference/
          if-no-files-found: error
          retention-days: 14
