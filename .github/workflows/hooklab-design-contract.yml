name: HookLab Design Contract
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  reference:
    name: Frozen browser reference and semantic gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Python QA dependencies
        run: python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0' 'numpy==2.3.5'
      - name: Install deterministic browser and font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-roboto
          fc-cache -f
          fc-match Roboto -f '%{family}\n' | grep -F Roboto
          python -m playwright install --with-deps chromium
      - name: Repeat all 24 exact browser reference states
        id: browser_reference
        run: |
          python3 -B scripts/qa/visual_image_checks.py
          python3 -B scripts/qa/reference.py repeat --out "$RUNNER_TEMP/hooklab-reference"
          python3 -B scripts/qa/visual_report_checks.py --reference "$RUNNER_TEMP/hooklab-reference/first"
          python3 -B scripts/qa/uxm_reference.py --repeat --out "$RUNNER_TEMP/hooklab-uxm-design"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/hooklab-reference/source-commit.txt"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.browser_reference.outcome != 'skipped'
        with:
          name: hooklab-browser-reference-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-reference/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.browser_reference.outcome != 'skipped'
        with:
          name: hooklab-uxm-design-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-uxm-design/
          if-no-files-found: error
          retention-days: 14
