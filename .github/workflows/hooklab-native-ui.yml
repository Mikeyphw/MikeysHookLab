name: HookLab Native UI Baseline
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      shared_apks:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  baseline:
    name: Real Activity native visual candidate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Require KVM, space and exact source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          test "$(df -Pk "${ANDROID_AVD_HOME:-$HOME/.android/avd}" | awk 'END {print $4}')" -ge 4194304
      - name: Debug and instrumentation APKs (hosted only)
        if: ${{ !inputs.shared_apks }}
        env:
          HOOKLAB_CI_RETRY_PROFILE: native
        run: bash scripts/ci_gradle_retry.sh bash gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :probe-target:assembleDebug
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        if: ${{ inputs.shared_apks }}
        with:
          name: hooklab-matrix-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/matrix-apks
      - uses: actions/download-artifact@v8
        if: ${{ inputs.shared_apks }}
        with:
          name: hooklab-shared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-release
      - name: Verify exact shared APKs and restore native input paths
        if: ${{ inputs.shared_apks }}
        run: python3 -B scripts/qa/shared_native_apks.py restore --apks "$RUNNER_TEMP/matrix-apks" --release "$RUNNER_TEMP/shared-release"
      - uses: actions/download-artifact@v8
        if: ${{ inputs.shared_apks }}
        with:
          name: hooklab-mod01-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod01-probe
      - name: Bind standalone probe APKs to the exact source and attempt
        if: ${{ !inputs.shared_apks }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/mod01-probe"
          cp probe-target/build/outputs/apk/debug/probe-target-debug.apk "$RUNNER_TEMP/mod01-probe/target.apk"
          python3 -B scripts/qa/mod01_probe_apk.py publish --debug app/build/outputs/apk/debug/app-debug.apk --release app/build/outputs/apk/release/app-release-unsigned.apk --target "$RUNNER_TEMP/mod01-probe/target.apk" --receipt "$RUNNER_TEMP/mod01-probe/probe-receipt.json"
      - name: Pinned reference renderer (same source and workflow attempt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-roboto
          fc-cache -f
          fc-match Roboto -f '%{family}\n' | grep -F Roboto
          python -m pip install 'playwright==1.57.0' 'Pillow==11.3.0' 'numpy==2.3.5'
          python -m playwright install --with-deps chromium
          python3 -B scripts/qa/reference.py repeat --out "$RUNNER_TEMP/hooklab-comparison-reference"
          python3 -B scripts/qa/visual.py bind --reference "$RUNNER_TEMP/hooklab-comparison-reference/first"
          python3 -B scripts/qa/uxm_reference.py --repeat --out "$RUNNER_TEMP/hooklab-uxm-evidence/browser"
          python3 -B scripts/qa/visual_image_checks.py
          python3 -B scripts/qa/visual_report_checks.py --reference "$RUNNER_TEMP/hooklab-comparison-reference/first"
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/hooklabctl/go.mod
          cache: false
      - name: Build independently signed migration test packs (hosted D8 only)
        run: python3 -B scripts/qa/mod02_hosted_packs.py build --out "$RUNNER_TEMP/mod02-packs" --personal "$RUNNER_TEMP/mod02-personal" --ui-fixture "$RUNNER_TEMP/mod03-private-fixture"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hooklab-mod02-test-packs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod02-packs/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hooklab-mod02-personal-signing-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod02-personal/
          if-no-files-found: error
          retention-days: 14
      - name: Real Activity on isolated API36 emulator (candidate baseline)
        id: native_capture
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            python3 -B scripts/qa/native_smoke.py run --out "$RUNNER_TEMP/hooklab-native-smoke" --probe-dir "$RUNNER_TEMP/mod01-probe"
            && python3 -B scripts/qa/uxm_native.py --out "$RUNNER_TEMP/hooklab-uxm-evidence/native"
            && python3 -B scripts/qa/mod02_hosted_packs.py art --out "$RUNNER_TEMP/mod02-packs" --evidence "$RUNNER_TEMP/mod02-art.json"
            && python3 -B scripts/qa/mod03_visual.py capture --out "$RUNNER_TEMP/mod03-visual" --fixture "$RUNNER_TEMP/mod03-private-fixture"
      - uses: actions/upload-artifact@v7.0.2
        if: failure() && steps.native_capture.outcome == 'failure'
        with:
          name: hooklab-mod03-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod03-visual/receipt.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify exact pack, unsigned inputs and ART receipt (independent Go reader)
        run: |
          go -C tools/hooklabctl build -o "$RUNNER_TEMP/hooklabctl-mod02-verify" ./cmd/hooklabctl
          python3 -B scripts/qa/mod02_hosted_packs.py verify --out "$RUNNER_TEMP/mod02-packs" --personal "$RUNNER_TEMP/mod02-personal" --evidence "$RUNNER_TEMP/mod02-art.json" --cli "$RUNNER_TEMP/hooklabctl-mod02-verify"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hooklab-mod02-art-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod02-art.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify module candidate evidence (not visual approval)
        run: python3 -B scripts/qa/mod03_visual.py verify --out "$RUNNER_TEMP/mod03-visual"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hooklab-mod03-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mod03-visual/
          if-no-files-found: error
          retention-days: 14
      - name: Independently verify screenshot hashes, identity and route evidence
        run: python3 -B scripts/qa/native_smoke.py verify --out "$RUNNER_TEMP/hooklab-native-smoke"
      - name: Compare candidate native screens and independently recompute report
        run: |
          set -Eeuo pipefail
          python3 -B scripts/qa/visual.py compare --reference "$RUNNER_TEMP/hooklab-comparison-reference/first" --native "$RUNNER_TEMP/hooklab-native-smoke" --out "$RUNNER_TEMP/hooklab-visual-report"
          python3 -B scripts/qa/visual.py verify --reference "$RUNNER_TEMP/hooklab-comparison-reference/first" --native "$RUNNER_TEMP/hooklab-native-smoke" --out "$RUNNER_TEMP/hooklab-visual-report"
      - name: Enforce all admitted UX-M fidelity and journey gates
        run: |
          set -Eeuo pipefail
          for mode in compare verify; do
            python3 -B scripts/qa/uxm_visual.py "$mode" --first "$RUNNER_TEMP/hooklab-uxm-evidence/browser/first" --second "$RUNNER_TEMP/hooklab-uxm-evidence/browser/second" --native "$RUNNER_TEMP/hooklab-native-smoke" --module "$RUNNER_TEMP/mod03-visual" --uxm "$RUNNER_TEMP/hooklab-uxm-evidence/native" --out "$RUNNER_TEMP/hooklab-uxm-evidence/report"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hooklab-uxm-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-uxm-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.native_capture.outcome != 'skipped'
        with:
          name: hooklab-native-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-native-smoke/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hooklab-visual-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-visual-report/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: hooklab-native-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hooklab-comparison-reference/
          if-no-files-found: warn
          retention-days: 14
